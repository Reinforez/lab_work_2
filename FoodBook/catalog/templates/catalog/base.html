{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FoodBook{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'catalog/style.css' %}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{% url 'home' %}">FoodBook</a>
    <nav>
        {% if user.is_authenticated %}
            <span class="muted">Вы вошли как {{ user.username }}</span>
            <a href="{% url 'add_entry' %}">Добавить запись</a>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
                {% csrf_token %}
                <button class="link-button" type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
        <a href="/admin/">Админ-панель</a>
    </nav>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
