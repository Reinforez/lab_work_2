{% extends "catalog/base.html" %}
{% block title %}Запись — FoodBook{% endblock %}
{% block content %}
<h1>Запись</h1>
<article class="entry">
    <div>
        <h2>{{ entry.name }}</h2>
        <p>Любимое блюдо: <strong>{{ entry.favorite_dish }}</strong></p>
        <p class="muted">Владелец: {{ entry.owner.username|default:"Не указан" }}</p>
    </div>
</article>
<a href="{% url 'home' %}">Вернуться в каталог</a>
{% endblock %}
